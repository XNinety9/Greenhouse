[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:wireguard]
command=/bin/bash /usr/local/bin/start-wireguard.sh
autostart=true
autorestart=false
priority=1
stdout_logfile=/var/log/supervisor/wireguard.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/wireguard_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
startsecs=5
startretries=3

[program:rtorrent]
command=/usr/bin/rtorrent -n -o import=/config/rtorrent/rtorrent.rc
user=rtorrent
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/rtorrent.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/rtorrent_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
startsecs=10
startretries=3
environment=TERM="xterm"

[program:flood]
command=/usr/local/bin/flood --host=0.0.0.0 --port=5000 --rundir=/config/flood --auth=none --rtsocket=/var/run/rtorrent/rpc.sock
user=rtorrent
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/flood.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/flood_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
startsecs=10
startretries=3
